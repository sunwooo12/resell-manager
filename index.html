<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>리셀 재고관리</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f5f4f0;color:#1a1a1a;min-height:100vh;}
header{background:#fff;border-bottom:1px solid #e2e0da;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;}
.logo{font-size:17px;font-weight:700;}
.logo span{color:#888;font-weight:400;}
nav{display:flex;gap:4px;}
button.nb{padding:7px 16px;border-radius:8px;border:none;background:none;font-size:14px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:#888;font-weight:500;}
button.nb.on{background:#1a1a1a;color:#fff;}
main{max-width:900px;margin:0 auto;padding:28px 20px;}
.sec{display:none;}
.sec.on{display:block;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat{background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:18px 20px;}
.sl{font-size:12px;color:#888;margin-bottom:6px;}
.sv{font-size:24px;font-weight:700;}
.sv.g{color:#16a34a;}
.sv.r{color:#dc2626;}
.toolbar{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
button.fb{padding:6px 14px;border-radius:999px;border:1px solid #e2e0da;background:#fff;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:#888;}
button.fb.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
button.ab{margin-left:auto;padding:8px 18px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:14px;font-family:'Noto Sans KR',sans-serif;font-weight:500;cursor:pointer;}
.list{display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:18px 20px;}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.cn{font-size:15px;font-weight:700;margin-bottom:3px;}
.cs{font-size:12px;color:#888;}
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
.bY{background:#fef9c3;color:#854d0e;}
.bB{background:#dbeafe;color:#2563eb;}
.bG{background:#dcfce7;color:#16a34a;}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.ml{font-size:11px;color:#888;}
.mv{font-size:13px;font-weight:500;}
.mv.g{color:#16a34a;}
.mv.r{color:#dc2626;}
.acts{display:flex;gap:8px;border-top:1px solid #e2e0da;padding-top:12px;}
button.btn{padding:6px 14px;border-radius:8px;border:1px solid #e2e0da;background:none;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:#1a1a1a;}
button.btnP{padding:6px 14px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;}
button.btnD{padding:6px 14px;border-radius:8px;border:1px solid #fca5a5;background:none;font-size:13px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:#dc2626;}
.inf{background:#f5f4f0;border-radius:8px;padding:14px;margin-top:12px;display:none;}
.inf.on{display:block;}
.ig{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.ig input,.ig select,.inf select{padding:7px 10px;border:1px solid #e2e0da;border-radius:8px;font-size:13px;font-family:'Noto Sans KR',sans-serif;background:#fff;width:100%;}
.il{font-size:11px;color:#888;margin-bottom:4px;}
.empty{text-align:center;padding:60px 20px;color:#888;font-size:14px;}
.loading{text-align:center;padding:40px;color:#888;font-size:14px;}
.fc{background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:28px;max-width:600px;}
.ft{font-size:18px;font-weight:700;margin-bottom:24px;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
.fg label{font-size:13px;color:#888;font-weight:500;display:block;margin-bottom:6px;}
.fg input,.fg select{padding:9px 12px;border:1px solid #e2e0da;border-radius:8px;font-size:14px;font-family:'Noto Sans KR',sans-serif;color:#1a1a1a;background:#fff;width:100%;}
.full{grid-column:1/-1;}
.fa{display:flex;gap:10px;}
button.sb{padding:10px 24px;border-radius:8px;border:none;background:#1a1a1a;color:#fff;font-size:14px;font-family:'Noto Sans KR',sans-serif;font-weight:700;cursor:pointer;}
button.cb{padding:10px 24px;border-radius:8px;border:1px solid #e2e0da;background:none;font-size:14px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;color:#888;}
.cfg{background:#fff;border:1px solid #e2e0da;border-radius:12px;padding:28px;max-width:600px;}
.cfg h2{font-size:18px;font-weight:700;margin-bottom:8px;}
.cfg p{font-size:13px;color:#888;margin-bottom:24px;line-height:1.6;}
.cfg label{font-size:13px;color:#888;display:block;margin-bottom:6px;}
.cfg input{width:100%;padding:10px 12px;border:1px solid #e2e0da;border-radius:8px;font-size:13px;font-family:'Noto Sans KR',sans-serif;margin-bottom:16px;background:#fff;display:block;}
.al{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;}
.alOk{background:#dcfce7;color:#16a34a;}
.alErr{background:#fee2e2;color:#dc2626;}
</style>
</head>
<body>
<header>
  <div class="logo">리셀 재고관리 <span>by 선우</span></div>
  <nav>
    <button class="nb" id="t0" onclick="go(0)">재고 현황</button>
    <button class="nb" id="t1" onclick="go(1)">매입 등록</button>
    <button class="nb" id="t2" onclick="go(2)">수익 통계</button>
    <button class="nb" id="t3" onclick="go(3)">설정</button>
  </nav>
</header>
<main>
  <div class="sec" id="s0">
    <div class="stats">
      <div class="stat"><div class="sl">전체 재고</div><div class="sv" id="h0">-</div></div>
      <div class="stat"><div class="sl">보유 / 등록중</div><div class="sv" id="h1">-</div></div>
      <div class="stat"><div class="sl">이번달 수익</div><div class="sv" id="h2">-</div></div>
    </div>
    <div class="toolbar">
      <button class="fb on" onclick="filt('all',this)">전체</button>
      <button class="fb" onclick="filt('보유중',this)">보유중</button>
      <button class="fb" onclick="filt('등록중',this)">등록중</button>
      <button class="fb" onclick="filt('판매완료',this)">판매완료</button>
      <button class="ab" onclick="go(1)">+ 매입 등록</button>
    </div>
    <div id="itemList" class="list"><div class="loading">불러오는 중...</div></div>
  </div>

  <div class="sec" id="s1">
    <div class="fc">
      <div class="ft">매입 등록</div>
      <div class="fg">
        <div class="full"><label>상품명 *</label><input type="text" id="fn" placeholder="나이키 에어포스1 화이트"/></div>
        <div><label>사이즈</label><input type="text" id="fz" placeholder="270"/></div>
        <div><label>매입처</label><select id="fs"><option>SSG</option><option>무신사</option><option>네이버</option><option>오프라인</option><option>기타</option></select></div>
        <div><label>매입가 (원) *</label><input type="number" id="fp" placeholder="150000"/></div>
        <div><label>매입일 *</label><input type="date" id="fd"/></div>
        <div class="full"><label>메모</label><input type="text" id="fm" placeholder="보관 위치 등"/></div>
      </div>
      <div class="fa">
        <button class="sb" onclick="addItem()">등록하기</button>
        <button class="cb" onclick="go(0)">취소</button>
      </div>
    </div>
  </div>

  <div class="sec" id="s2">
    <div class="stats">
      <div class="stat"><div class="sl">총 매입 비용</div><div class="sv" id="p0">-</div></div>
      <div class="stat"><div class="sl">총 판매 수익</div><div class="sv" id="p1">-</div></div>
      <div class="stat"><div class="sl">총 순수익</div><div class="sv" id="p2">-</div></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="sl">보유중</div><div class="sv" id="p3">-</div></div>
      <div class="stat"><div class="sl">등록중</div><div class="sv" id="p4">-</div></div>
      <div class="stat"><div class="sl">판매완료</div><div class="sv g" id="p5">-</div></div>
    </div>
  </div>

  <div class="sec" id="s3">
    <div class="cfg">
      <h2>Supabase 연결 설정</h2>
      <p>Supabase에서 복사한 키를 입력하세요.<br>한 번만 입력하면 이 기기에 저장돼요.</p>
      <div id="alert"></div>
      <label>Project URL</label>
      <input type="text" id="cu" placeholder="https://xxxx.supabase.co"/>
      <label>Publishable Key</label>
      <input type="text" id="ck" placeholder="sb_publishable_..."/>
      <button class="sb" onclick="saveCfg()">저장 및 연결</button>
    </div>
  </div>
</main>
<script>
var sb=null,items=[],cf='all',oid=null;
var tabs=['t0','t1','t2','t3'],secs=['s0','s1','s2','s3'];

function go(i){
  tabs.forEach(function(t,j){
    document.getElementById(t).className='nb'+(i===j?' on':'');
    document.getElementById(secs[j]).className='sec'+(i===j?' on':'');
  });
  if(i===0)load();
  if(i===2)loadStats();
  if(i===3){
    document.getElementById('cu').value=localStorage.getItem('rsu')||'';
    document.getElementById('ck').value=localStorage.getItem('rsk')||'';
  }
}

function saveCfg(){
  var u=document.getElementById('cu').value.trim();
  var k=document.getElementById('ck').value.trim();
  if(!u||!k){document.getElementById('alert').innerHTML='<div class="al alErr">URL과 Key를 모두 입력해주세요.</div>';return;}
  localStorage.setItem('rsu',u);
  localStorage.setItem('rsk',k);
  sb=window.supabase.createClient(u,k);
  document.getElementById('alert').innerHTML='<div class="al alOk">연결 성공! 재고 현황으로 이동합니다.</div>';
  setTimeout(function(){go(0);},1200);
}

function init(){
  var u=localStorage.getItem('rsu'),k=localStorage.getItem('rsk');
  if(u&&k){sb=window.supabase.createClient(u,k);return true;}
  return false;
}

function filt(f,btn){
  cf=f;
  document.querySelectorAll('.fb').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  render();
}

async function load(){
  if(!sb){document.getElementById('itemList').innerHTML='<div class="empty">설정 탭에서 Supabase 키를 먼저 입력해주세요.</div>';return;}
  document.getElementById('itemList').innerHTML='<div class="loading">불러오는 중...</div>';
  var res=await sb.from('items').select('*').order('created_at',{ascending:false});
  if(res.error){document.getElementById('itemList').innerHTML='<div class="empty">데이터를 불러오지 못했어요.</div>';return;}
  items=res.data||[];
  var total=items.length;
  var active=items.filter(function(i){return i.status!=='판매완료';}).length;
  var now=new Date();
  var mm=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var profit=items.filter(function(i){return i.status==='판매완료'&&i.sell_date&&i.sell_date.startsWith(mm);}).reduce(function(s,i){return s+i.sell_price-i.buy_price-(i.fee||0);},0);
  document.getElementById('h0').textContent=total+'개';
  document.getElementById('h1').textContent=active+'개';
  var pe=document.getElementById('h2');
  pe.textContent=(profit>=0?'+':'')+profit.toLocaleString()+'원';
  pe.className='sv '+(profit>=0?'g':'r');
  render();
}

function render(){
  var filtered=cf==='all'?items:items.filter(function(i){return i.status===cf;});
  var el=document.getElementById('itemList');
  if(!filtered.length){el.innerHTML='<div class="empty">해당하는 상품이 없어요</div>';return;}
  el.innerHTML=filtered.map(function(it){return card(it);}).join('');
}

function card(it){
  var profit=it.status==='판매완료'?it.sell_price-it.buy_price-(it.fee||0):null;
  var ph=profit!==null?'<div><div class="ml">순수익</div><div class="mv '+(profit>=0?'g':'r')+'">'+(profit>=0?'+':'')+profit.toLocaleString()+'원</div></div>':'';
  var sm=it.status==='판매완료'?'<div><div class="ml">판매가</div><div class="mv">'+it.sell_price.toLocaleString()+'원</div></div><div><div class="ml">판매일</div><div class="mv">'+(it.sell_date||'-')+'</div></div><div><div class="ml">플랫폼</div><div class="mv">'+(it.platform||'-')+'</div></div>'+ph:'';
  var lm=it.status==='등록중'?'<div><div class="ml">등록 플랫폼</div><div class="mv">'+(it.platform||'-')+'</div></div>':'';
  var acts='';
  if(it.status==='보유중') acts='<button class="btn" onclick="tog(\'lf'+it.id+'\')">플랫폼 등록</button><button class="btnD" onclick="del(\''+it.id+'\')">삭제</button>';
  else if(it.status==='등록중') acts='<button class="btnP" onclick="tog(\'sf'+it.id+'\')">판매 완료</button><button class="btnD" onclick="del(\''+it.id+'\')">삭제</button>';
  var lf=it.status==='보유중'?'<div class="inf'+(oid==='lf'+it.id?' on':'')+'" id="lf'+it.id+'"><div class="il">등록 플랫폼</div><select id="lp'+it.id+'" style="width:200px;padding:7px 10px;border:1px solid #e2e0da;border-radius:8px;font-size:13px;margin-bottom:10px;"><option>크림</option><option>포이즌</option><option>기타</option></select><br><button class="btnP" onclick="confList(\''+it.id+'\')">등록 확정</button></div>':'';
  var sf=it.status==='등록중'?'<div class="inf'+(oid==='sf'+it.id?' on':'')+'" id="sf'+it.id+'"><div class="ig"><div><div class="il">판매가 (원)</div><input type="number" id="sp'+it.id+'" placeholder="200000"></div><div><div class="il">수수료 (원)</div><input type="number" id="fe'+it.id+'" placeholder="10000"></div><div><div class="il">판매일</div><input type="date" id="sd'+it.id+'" value="'+new Date().toISOString().split('T')[0]+'"></div></div><button class="btnP" onclick="confSell(\''+it.id+'\')">판매 확정</button></div>':'';
  var bc=it.status==='보유중'?'bY':it.status==='등록중'?'bB':'bG';
  return '<div class="card"><div class="ctop"><div><div class="cn">'+it.name+(it.size?' '+it.size:'')+'</div><div class="cs">'+it.source+' · 매입 '+it.buy_date+'</div></div><span class="badge '+bc+'">'+it.status+'</span></div><div class="meta"><div><div class="ml">매입가</div><div class="mv">'+it.buy_price.toLocaleString()+'원</div></div>'+sm+lm+(it.note?'<div style="grid-column:1/-1"><div class="ml">메모</div><div class="mv" style="font-size:12px;">'+it.note+'</div></div>':'')+'</div>'+(acts?'<div class="acts">'+acts+'</div>':'')+lf+sf+'</div>';
}

function tog(key){oid=oid===key?null:key;render();}

async function addItem(){
  var name=document.getElementById('fn').value.trim();
  var size=document.getElementById('fz').value.trim();
  var source=document.getElementById('fs').value;
  var price=parseInt(document.getElementById('fp').value);
  var date=document.getElementById('fd').value;
  var note=document.getElementById('fm').value.trim();
  if(!name||!price||!date){alert('상품명, 매입가, 매입일은 필수예요!');return;}
  if(!sb){alert('설정 탭에서 Supabase 키를 먼저 입력해주세요.');return;}
  var res=await sb.from('items').insert([{name:name,size:size,source:source,buy_price:price,buy_date:date,note:note,status:'보유중'}]);
  if(res.error){alert('등록 실패: '+res.error.message);return;}
  document.getElementById('fn').value='';
  document.getElementById('fz').value='';
  document.getElementById('fp').value='';
  document.getElementById('fm').value='';
  alert('매입 등록 완료!');
  go(0);
}

async function confList(id){
  var platform=document.getElementById('lp'+id).value;
  var res=await sb.from('items').update({status:'등록중',platform:platform}).eq('id',id);
  if(res.error){alert('오류: '+res.error.message);return;}
  oid=null;load();
}

async function confSell(id){
  var sp=parseInt(document.getElementById('sp'+id).value);
  var fee=parseInt(document.getElementById('fe'+id).value)||0;
  var sd=document.getElementById('sd'+id).value;
  if(!sp||!sd){alert('판매가와 판매일을 입력해주세요.');return;}
  var res=await sb.from('items').update({status:'판매완료',sell_price:sp,fee:fee,sell_date:sd}).eq('id',id);
  if(res.error){alert('오류: '+res.error.message);return;}
  oid=null;load();
}

async function del(id){
  if(!confirm('정말 삭제하시겠어요?'))return;
  var res=await sb.from('items').delete().eq('id',id);
  if(res.error){alert('오류: '+res.error.message);return;}
  load();
}

async function loadStats(){
  if(!sb)return;
  var res=await sb.from('items').select('*');
  var its=res.data||[];
  var tb=its.reduce(function(s,i){return s+i.buy_price;},0);
  var sold=its.filter(function(i){return i.status==='판매완료';});
  var ts=sold.reduce(function(s,i){return s+(i.sell_price||0);},0);
  var tp=sold.reduce(function(s,i){return s+i.sell_price-i.buy_price-(i.fee||0);},0);
  document.getElementById('p0').textContent=tb.toLocaleString()+'원';
  document.getElementById('p1').textContent=ts.toLocaleString()+'원';
  var pe=document.getElementById('p2');
  pe.textContent=(tp>=0?'+':'')+tp.toLocaleString()+'원';
  pe.className='sv '+(tp>=0?'g':'r');
  document.getElementById('p3').textContent=its.filter(function(i){return i.status==='보유중';}).length+'개';
  document.getElementById('p4').textContent=its.filter(function(i){return i.status==='등록중';}).length+'개';
  document.getElementById('p5').textContent=sold.length+'개';
}

document.getElementById('fd').value=new Date().toISOString().split('T')[0];
if(init()){go(0);}else{go(3);}
</script>
</body>
</html>
